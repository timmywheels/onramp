id = "languages"
name = "Languages"
version = "1.0.0"
api_version = 1
description = "Syntax highlighting for common languages (tree-sitter grammars built into pairprogram)."
authors = ["pairprogram"]

# Each entry maps file types to a grammar. Add your own in an extension of
# yours, optionally with `highlights = "path/to/highlights.scm"` to replace
# the grammar's query.
languages = [
  { name = "TypeScript", grammar = "typescript", suffixes = ["ts", "mts", "cts"] },
  { name = "TSX", grammar = "tsx", suffixes = ["tsx"] },
  { name = "JavaScript", grammar = "javascript", suffixes = ["js", "mjs", "cjs", "jsx"] },
  { name = "JSON", grammar = "json", suffixes = ["json", "jsonc", "json5", ".prettierrc", ".eslintrc"] },
  { name = "Rust", grammar = "rust", suffixes = ["rs"] },
  { name = "Python", grammar = "python", suffixes = ["py", "pyi"] },
  { name = "Go", grammar = "go", suffixes = ["go"] },
  { name = "Swift", grammar = "swift", suffixes = ["swift"] },
  { name = "Java", grammar = "java", suffixes = ["java"] },
  { name = "Ruby", grammar = "ruby", suffixes = ["rb", "rake", "Gemfile", "Rakefile"] },
  { name = "C", grammar = "c", suffixes = ["c", "h"] },
  { name = "C++", grammar = "cpp", suffixes = ["cc", "cpp", "cxx", "hpp", "hh", "hxx"] },
  { name = "CSS", grammar = "css", suffixes = ["css"] },
  { name = "HTML", grammar = "html", suffixes = ["html", "htm"] },
  { name = "Shell", grammar = "bash", suffixes = ["sh", "bash", "zsh", ".zshrc", ".bashrc"] },
  { name = "TOML", grammar = "toml", suffixes = ["toml", "Cargo.lock"] },
  { name = "YAML", grammar = "yaml", suffixes = ["yml", "yaml"] },
]
